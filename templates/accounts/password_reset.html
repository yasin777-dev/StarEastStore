{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card se-auth-card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="se-auth-icon"><i class="bi bi-key"></i></div>
            <h1 class="h4 fw-bold mb-1">Forgot your password?</h1>
            <p class="text-secondary small mb-0">Enter your email and we'll send you a reset link.</p>
          </div>
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="id_email">Email address</label>
              <input type="email" name="email" id="id_email" class="form-control {% if form.email.errors %}is-invalid{% endif %}" required autofocus>
              {% for error in form.email.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
            </div>
            <button type="submit" class="btn se-btn-primary w-100">Send reset link</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
