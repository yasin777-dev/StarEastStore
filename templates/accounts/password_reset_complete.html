{% extends 'base.html' %}
{% block title %}Password reset complete{% endblock %}
{% block content %}
<section class="container py-5 text-center">
  <div class="se-success-icon mx-auto"><i class="bi bi-check2-circle"></i></div>
  <h1 class="se-section-title">All set!</h1>
  <p class="text-secondary">Your password has been reset. You can now log in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="btn se-btn-primary mt-2">Log in</a>
</section>
{% endblock %}
