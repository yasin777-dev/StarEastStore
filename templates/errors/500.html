{% extends 'base.html' %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<section class="container py-5 text-center error-page">
  <div class="display-1 fw-bold se-text-gradient">500</div>
  <h2 class="h4 mb-3"><i class="bi bi-bug me-2"></i>Something went wrong</h2>
  <p class="text-secondary mb-4">An unexpected error occurred on our side. Our team has been notified - please try again in a moment.</p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="{% url 'core:home' %}" class="btn se-btn-primary"><i class="bi bi-house me-1"></i>Home</a>
    <a href="{% url 'products:list' %}" class="btn se-btn-outline"><i class="bi bi-bag me-1"></i>Continue shopping</a>
  </div>
</section>
{% endblock %}
