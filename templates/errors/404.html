{% extends 'base.html' %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="container py-5 text-center error-page">
  <div class="display-1 fw-bold se-text-gradient">404</div>
  <h2 class="h4 mb-3"><i class="bi bi-search me-2"></i>Page not found</h2>
  <p class="text-secondary mb-4">The page you're looking for doesn't exist or may have moved.</p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="{% url 'core:home' %}" class="btn se-btn-primary"><i class="bi bi-house me-1"></i>Home</a>
    <a href="{% url 'products:list' %}" class="btn se-btn-outline"><i class="bi bi-bag me-1"></i>Continue shopping</a>
  </div>
</section>
{% endblock %}
