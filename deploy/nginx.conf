# Nginx reverse proxy for StarEastStore (used by docker-compose and as a
# reference for bare-metal deployments).

upstream stareast_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Static files (collectstatic output shared via the static_data volume).
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded media.
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://stareast_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Security headers (Django sets some too; these cover static responses).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}

